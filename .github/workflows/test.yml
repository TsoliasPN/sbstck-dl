name: Run Tests
on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        go-version: [1.24.1]
        include:
          - os: ubuntu-latest
            runner: ${{ fromJSON(vars.CI_RUNNER_JSON || '["ubuntu-latest"]') }}
          - os: macos-latest
            runner: ${{ fromJSON(vars.CI_RUNNER_MAC_JSON || '["macos-latest"]') }}
          - os: windows-latest
            runner: ${{ fromJSON(vars.CI_RUNNER_WIN_JSON || '["windows-latest"]') }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
          
      - name: Run tests
        run: go test -v ./...